<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitter Sentiment Analysis</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(45deg, #1DA1F2, #0066cc, #1C8EF2);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* Twitter Icons Styling */
        .twitter-icon {
            position: absolute;
            font-size: 30px;
            color: rgba(255, 255, 255, 0.5);
            animation: floatUpDown 3s infinite alternate ease-in-out, rotateIcon 6s infinite alternate ease-in-out;
        }

        @keyframes floatUpDown {
            from { transform: translateY(0px); }
            to { transform: translateY(15px); }
        }

        @keyframes rotateIcon {
            from { transform: rotate(0deg); }
            to { transform: rotate(10deg); }
        }

        /* Glass Effect for the main box */
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 30px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 20px;
        }

        .tagline {
            font-size: 16px;
            color: #ddd;
            margin-bottom: 30px;
        }

        /* Input and Button Styling */
        .input-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-container textarea {
            padding: 15px;
            font-size: 16px;
            border-radius: 10px;
            border: 2px solid #ddd;
            background: rgba(255, 255, 255, 0.8);
            color: #333;
            resize: none;
            height: 120px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-container textarea:focus {
            border-color: #0066cc;
            box-shadow: 0 0 8px rgba(0, 102, 204, 0.5);
        }

        .input-container button {
            padding: 15px;
            font-size: 18px;
            color: white;
            background-color: #0066cc;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s, box-shadow 0.3s;
        }

        .input-container button:hover {
            background-color: #005bb5;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 102, 204, 0.4);
        }

        footer {
            position: absolute;
            bottom: 20px;
            font-size: 14px;
            color: #ddd;
            text-align: center;
            width: 100%;
        }

        footer a {
            color: #fff;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Background Twitter Icons -->
    <div id="background-icons"></div>

    <!-- Main content container -->
    <div class="container">
        <h1>Twitter Sentiment Analysis</h1>
        <p class="tagline">Enter a tweet to analyze its sentiment!</p>

        <form class="input-container" action="/predict" method="POST">
            <textarea name="message" placeholder="Type your tweet here..." required></textarea>
            <button type="submit">Analyze Sentiment</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2025 Sentiment Analysis | <a href="#">Privacy Policy</a></p>
    </footer>

    <script>
        function createTwitterIcons() {
            const iconContainer = document.getElementById("background-icons");
            const numberOfIcons = 25; // Adjust the number of icons

            for (let i = 0; i < numberOfIcons; i++) {
                let x = Math.random() * window.innerWidth;
                let y = Math.random() * window.innerHeight;
                let size = Math.random() * 30 + 20; // Between 20px and 50px
                let opacity = Math.random() * 0.6 + 0.2; // Opacity between 0.2 and 0.8

                let icon = document.createElement("i");
                icon.className = "fab fa-twitter twitter-icon";
                icon.style.left = `${x}px`;
                icon.style.top = `${y}px`;
                icon.style.fontSize = `${size}px`;
                icon.style.opacity = opacity;

                iconContainer.appendChild(icon);
            }
        }

        // Call function when the page loads
        document.addEventListener("DOMContentLoaded", createTwitterIcons);
    </script>

</body>
</html>
