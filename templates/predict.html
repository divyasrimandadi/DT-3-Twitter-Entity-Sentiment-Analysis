<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(45deg, #1DA1F2, #0066cc, #1C8EF2);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            z-index: 10;
            position: relative;
        }

        h1 { 
            font-size: 30px; 
            margin-bottom: 20px; 
        }

        .result-container {
            margin-top: 20px;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
        }

        .positive { color: #28a745; }
        .negative { color: #dc3545; }
        .neutral { color: #ffc107; }

        .home-btn {
            margin-top: 20px;
            padding: 12px 20px;
            font-size: 16px;
            background-color: #0066cc;
            border: none;
            border-radius: 10px;
            text-decoration: none;
            display: inline-block;
            color: white;
        }

        .home-btn:hover { background-color: #005bb5; }

        .twitter-icon {
            position: absolute;
            font-size: 30px;
            color: rgba(255, 255, 255, 0.5);
            animation: fadeInOut 3s infinite alternate;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Prediction Result</h1>
        <p class="result-container {{ sentiment }}">{{ sentiment }}</p>
        <a href="/" class="home-btn">Go Back</a>
    </div>

    <script>
        function createTwitterIcons() {
            for (let i = 0; i < 10; i++) {
                let icon = document.createElement("i");
                icon.classList.add("fab", "fa-twitter", "twitter-icon");
                icon.style.left = Math.random() * 100 + "vw";
                icon.style.top = Math.random() * 100 + "vh";
                icon.style.animationDelay = Math.random() * 3 + "s";
                document.body.appendChild(icon);
            }
        }
        createTwitterIcons();
    </script>
</body>
</html>
