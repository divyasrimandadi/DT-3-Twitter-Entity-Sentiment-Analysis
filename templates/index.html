<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitter Entity Sentiment Analysis</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1DA1F2, #141E30);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Glass Effect for the main box */
        .container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 600px;
            width: 90%;
        }

        h1 {
            font-size: 32px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 20px;
        }

        .tagline {
            font-size: 18px;
            color: #ddd;
            margin-bottom: 30px;
        }

        .input-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-container input {
            padding: 15px;
            font-size: 16px;
            border-radius: 10px;
            border: none;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .input-container button {
            padding: 15px;
            font-size: 18px;
            color: white;
            background-color: #1DA1F2;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s, box-shadow 0.3s;
        }

        .input-container button:hover {
            background-color: #005bb5;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(29, 161, 242, 0.4);
        }

        footer {
            position: absolute;
            bottom: 20px;
            font-size: 14px;
            color: #aaa;
            text-align: center;
        }

        footer a {
            color: #1DA1F2;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        /* Floating Twitter Icons */
        .twitter-icon {
            position: absolute;
            color: rgba(255, 255, 255, 0.5);
            animation: float 5s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }
    </style>
</head>
<body>

    <!-- Main content container -->
    <div class="container">
        <h1>Twitter Entity Sentiment Analysis</h1>
        <p class="tagline">Discover the sentiment of any Twitter entity in seconds!</p>

        <div class="input-container">
            <input type="text" id="entityInput" placeholder="Enter a Twitter entity (e.g., @username or #hashtag)..." autofocus>
            <button onclick="analyzeSentiment()">Analyze Sentiment</button>
        </div>

        <div class="result-container" id="resultContainer" style="display: none; margin-top: 20px;">
            <p id="sentimentResult" style="color: #fff; font-size: 18px;">Sentiment result will be displayed here.</p>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Twitter Analysis | <a href="#">Privacy Policy</a></p>
    </footer>

    <script>
        function analyzeSentiment() {
            const entity = document.getElementById('entityInput').value;
            const resultContainer = document.getElementById('resultContainer');
            const sentimentResult = document.getElementById('sentimentResult');

            if (!entity) {
                alert('Please enter a Twitter entity!');
                return;
            }

            // Simulated sentiment analysis (replace with API or advanced logic)
            const sentiments = ['Positive', 'Negative', 'Neutral'];
            const randomSentiment = sentiments[Math.floor(Math.random() * sentiments.length)];

            resultContainer.style.display = 'block';
            sentimentResult.textContent = `The sentiment for ${entity} is: ${randomSentiment}`;
        
        }

        document.addEventListener('DOMContentLoaded', () => {
            const icons = 50;
            for (let i = 0; i < icons; i++) {
                const icon = document.createElement('i');
                icon.className = 'fab fa-twitter twitter-icon';
                icon.style.left = '${Math.random() * 100}vw';
                icon.style.top = '${Math.random() * 100}vh';
                icon.style.fontSize = '${Math.random() * 20 + 10}px';
                icon.style.opacity = Math.random();
                document.body.appendChild(icon);
            }
        });
    </script>
</body>
</html>
