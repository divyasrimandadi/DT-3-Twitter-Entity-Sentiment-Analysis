<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitter Sentiment Analysis</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #fff;
            text-align: center;
            overflow-x: hidden;
            background-color: #1DA1F2;
            position: relative;
        }

        .icon-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .icon {
            position: absolute;
            width: 30px;
            height: 30px;
            background: url('https://cdn-icons-png.flaticon.com/512/733/733579.png') no-repeat;
            background-size: contain;
            opacity: 0.6;
            animation: float 10s infinite ease-in-out;
        }

        .icon.highlight {
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.8));
            animation: glow 1.5s infinite alternate;
        }

        @keyframes float {
            0% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
            100% {
                transform: translateY(0);
            }
        }

        @keyframes glow {
            0% {
                opacity: 0.8;
            }
            100% {
                opacity: 1;
            }
        }

        header {
            background: rgba(0, 0, 0, 0.6);
            padding: 20px 0;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        header h1 {
            font-size: 2.5rem;
            margin: 0;
            color: #fff;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
        }

        .container {
            padding: 40px 20px;
            position: relative;
            z-index: 10;
        }

        .card {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin: 20px auto;
            max-width: 600px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
        }

        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
        }

        .card h2 {
            margin: 0 0 10px;
            font-size: 1.5rem;
        }

        .card p {
            font-size: 1rem;
            margin: 10px 0;
        }

        .btn {
            display: inline-block;
            background: #fff;
            color: #1DA1F2;
            border: none;
            border-radius: 50px;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .btn:hover {
            background: #1DA1F2;
            color: #fff;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
        }

        .input-section {
            margin-top: 20px;
        }

        .input-section input {
            width: 80%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            margin: 10px 0;
        }

        .input-section button {
            margin-top: 10px;
        }

        .result-section {
            margin-top: 30px;
            font-size: 1.2rem;
        }

        .result-positive {
            color: green;
        }

        .result-negative {
            color: red;
        }

        .result-neutral {
            color: black;
        }

        footer {
            margin-top: 40px;
            font-size: 0.9rem;
        }

        footer a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
    <script>
        function generateIcons() {
            const container = document.querySelector('.icon-background');
            const iconCount = 50;

            for (let i = 0; i < iconCount; i++) {
                const icon = document.createElement('div');
                icon.classList.add('icon');

                // Randomly assign the highlight class
                if (Math.random() > 0.7) {
                    icon.classList.add('highlight');
                }

                // Random position
                icon.style.top = `${Math.random() * 100}%`;
                icon.style.left = `${Math.random() * 100}%`;

                container.appendChild(icon);
            }
        }

        function analyzeSentiment() {
            const input = document.getElementById('tweetInput').value;
            const resultSection = document.getElementById('resultSection');

            if (!input.trim()) {
                resultSection.textContent = 'Please enter a valid tweet!';
                resultSection.className = 'result-section result-neutral';
                return;
            }

            // Mock sentiment analysis logic (replace this with backend integration)
            const positiveKeywords = ['good', 'great', 'happy', 'love', 'excellent','pretty'];
            const negativeKeywords = ['bad', 'sad', 'hate', 'angry', 'terrible'];

            let sentiment = 'Neutral';
            let sentimentClass = 'result-neutral';

            for (const keyword of positiveKeywords) {
                if (input.toLowerCase().includes(keyword)) {
                    sentiment = 'Positive';
                    sentimentClass = 'result-positive';
                    break;
                }
            }

            for (const keyword of negativeKeywords) {
                if (input.toLowerCase().includes(keyword)) {
                    sentiment = 'Negative';
                    sentimentClass = 'result-negative';
                    break;
                }
            }

            resultSection.textContent = `The sentiment of the tweet is: ${sentiment}`;
            resultSection.className = `result-section ${sentimentClass}`;
        }

        document.addEventListener('DOMContentLoaded', generateIcons);
    </script>
</head>
<body>
    <header>
        <h1>Twitter Sentiment Analysis</h1>
    </header>

    <div class="icon-background"></div>

    <div class="container">
        <div class="card">
            <h2>Analyze Tweets</h2>
            <p>Input a tweet to predict its sentiment and entities in real time.</p>
            <div class="input-section">
                <input type="text" id="tweetInput" placeholder="Enter a tweet">
                <button class="btn" onclick="analyzeSentiment()">Analyze</button>
            </div>
            <div id="resultSection" class="result-section"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Twitter Sentiment Analysis | <a href="#">Privacy Policy</a> | <a href="#">Contact Us</a></p>
    </footer>
</body>
</html>
